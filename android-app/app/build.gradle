plugins {
	id 'com.android.application'
}

android {
	namespace 'com.runescapeclaude.hpprayer'
	compileSdk 36

	defaultConfig {
		applicationId 'com.runescapeclaude.hpprayer'
		minSdk 26
		targetSdk 36
		versionCode 4
		versionName '1.3'
	}

	signingConfigs {
		// A fixed key checked into the repo, so every build can install over the last one without uninstalling.
		// It's a debug key for a personal sideloaded app, not something to publish on the Play Store with.
		shared {
			storeFile rootProject.file('debug.keystore')
			storePassword 'android'
			keyAlias 'androiddebugkey'
			keyPassword 'android'
		}
	}

	buildTypes {
		debug {
			signingConfig signingConfigs.shared
		}
		release {
			minifyEnabled false
			signingConfig signingConfigs.shared
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_11
		targetCompatibility JavaVersion.VERSION_11
	}
}
